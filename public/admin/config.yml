backend:
  name: git-gateway
  repo: Lossmeril/medihelix
  branch: dev
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/17f8e746-0421-48b3-9604-e7525bf1d61b/pkce
  auth_token_endpoint: /sites/17f8e746-0421-48b3-9604-e7525bf1d61b/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: '[skip ci] Upload "{{path}}"'
    deleteMedia: '[skip ci] Delete "{{path}}"'

media_folder: "public/uploads"
public_folder: "/uploads"

logo_url: "https://coalmarketing.cz/wp-content/uploads/2024/08/coalmarketing_logo_long_color-black-1024x239.png"
locale: "cs"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview: true
    fields:
      - { label: "Nadpis", name: "title", widget: "string" }
      - { label: "Datum publikace", name: "date", widget: "datetime" }
      - { label: "Obsah", name: "body", widget: "markdown" }
      - { label: "Náhledový obrázek", name: "image", widget: "image" }

  - name: "companies"
    label: "Společnosti"
    folder: "content/companies"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Název", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image", allow_multiple: false }
      - { label: "Web", name: "website", widget: "string", required: false }
      - { label: "Popis", name: "description", widget: "text", required: false }
      - label: "Viditelná"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "Pokud je vypnuto, společnost se nezobrazí nikde na webu."
      - label: "Zobrazit i bez produktů"
        name: "show_if_empty"
        widget: "boolean"
        default: false
        hint: "Pokud je zapnuto, společnost se zobrazí v seznamech i tehdy, když nemá přiřazen žádný viditelný produkt."
      - { label: "Obsah (Markdown)", name: "body", widget: "markdown", required: false }

  - name: "subcategories"
    label: "Podkategorie"
    folder: "content/subcategories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Název", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Popis", name: "description", widget: "text", required: false }
      - label: "Nadřazená kategorie"
        name: "parent"
        widget: "relation"
        collection: "subcategories"
        search_fields: ["name", "slug"]
        value_field: "slug"
        display_fields: ["name"]
        required: false
        hint: >
          Vyberte pouze přímého rodiče této kategorie — prarodiče se dědí automaticky.
          Příklad: pokud vytváříte „Řada iPonatic", přiřaďte rodiče „mPOCT".
          Kategorie „mPOCT" pak sama odkazuje na svého rodiče (pokud jej má).
          Systém hierarchii sestaví sám.

  - name: "instruments"
    label: "Přístroje"
    folder: "content/instruments"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{specs.model}}"
    fields:
      - label: "Název"
        name: "title"
        widget: "string"
        hint: "Marketingový název produktu (např. Perpetuum Mobile 2.0)"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL identifikátor (např. perpetuum-mobile-2-0)"
      - label: "Stručný popis"
        name: "summary"
        widget: "text"

      - label: "Výrobce"
        name: "companies"
        widget: "list"
        label_singular: "Výrobce"
        hint: "Vyberte výrobce ze seznamu společností"
        fields:
          - label: "Výrobce"
            name: "slug"
            widget: "relation"
            collection: "companies"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Podkategorie"
        name: "subcategories"
        widget: "list"
        label_singular: "Podkategorie"
        hint: "Vyberte podkategorie přístroje ze seznamu typů"
        fields:
          - label: "Podkategorie"
            name: "slug"
            widget: "relation"
            collection: "subcategories"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Vypíchnutý produkt?"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Viditelný"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "Pokud je vypnuto, přístroj se nezobrazí v katalogu, vyhledávání ani na stránce výrobce."

      - label: "Hlavní obrázek"
        name: "hero_image"
        widget: "image"
        allow_multiple: false

      - label: "Galerie"
        name: "gallery"
        widget: "list"
        field:
          label: "Obrázek"
          name: "image"
          widget: "image"

      - label: "Přednosti"
        name: "features"
        widget: "list"
        required: false
        fields:
          - { label: "Titulek", name: "title", widget: "string" }
          - { label: "Popis", name: "description", widget: "text", required: false }

      - label: "Specifikace"
        name: "specs"
        widget: "list"
        required: false
        hint: "Volné položky 'Název' + 'Hodnota'; přidejte jen to, co dává smysl pro daný produkt."
        fields:
          - { label: "Název parametru", name: "name", widget: "string" }
          - { label: "Hodnota", name: "value", widget: "string" }
          - { label: "Jednotka", name: "unit", widget: "string", required: false }
          - { label: "Skupina", name: "group", widget: "string", required: false }

      - label: "Skupiny testů"
        name: "test_groups"
        widget: "list"
        required: false
        label_singular: "Skupina testů"
        summary: "{{name}}"
        fields:
          - { label: "Název skupiny", name: "name", widget: "string" }
          - label: "Testy"
            name: "tests"
            widget: "list"
            label_singular: "Test"
            summary: "{{name}}"
            fields:
              - { label: "Název testu", name: "name", widget: "string" }
              - { label: "Cíle", name: "targets", widget: "string", required: false }
              - { label: "Kód", name: "code", widget: "string", required: false }
              - { label: "Poznámka", name: "note", widget: "text", required: false }

      - label: "Použití"
        name: "intended_use"
        widget: "list"
        field:
          label: "Typ použití"
          name: "place"
          widget: "string"

      - { label: "Objednací číslo / SKU", name: "sku", widget: "string" }
      - { label: "Tagy", name: "tags", widget: "list", required: false }
      - label: "Odkazy / Soubory"
        name: "assets"
        widget: "object"
        required: false
        fields:
          - { label: "Datový list (PDF)", name: "datasheet", widget: "file", required: false }
          - { label: "Externí odkaz", name: "external_url", widget: "string", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta description", name: "meta_description", widget: "text", required: false }

  - name: "quick-tests"
    label: "Rychlé testy / kity"
    folder: "content/quick-tests"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{technology}}"
    fields:
      - label: "Název"
        name: "title"
        widget: "string"
        hint: "Marketingový název produktu (např. AMPLIQUICK Fekální parazitologie)"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL identifikátor (např. ampliquick-fekalni-parazitologie)"
      - label: "Stručný popis"
        name: "summary"
        widget: "text"

      - label: "Výrobce"
        name: "companies"
        widget: "list"
        label_singular: "Výrobce"
        hint: "Vyberte výrobce ze seznamu společností"
        fields:
          - label: "Výrobce"
            name: "slug"
            widget: "relation"
            collection: "companies"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Podkategorie"
        name: "subcategories"
        widget: "list"
        label_singular: "Podkategorie"
        hint: "Vyberte podkategorie kitu ze seznamu typů"
        fields:
          - label: "Podkategorie"
            name: "slug"
            widget: "relation"
            collection: "subcategories"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Vypíchnutý produkt?"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Viditelný"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "Pokud je vypnuto, kit se nezobrazí v katalogu, vyhledávání ani na stránce výrobce."

      - label: "Hlavní obrázek"
        name: "hero_image"
        widget: "image"
        allow_multiple: false

      - label: "Galerie"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Obrázek"
          name: "image"
          widget: "image"

      - label: "Technologie"
        name: "technology"
        widget: "string"
        required: false
        hint: "Např. PCR, Multiplexní PCR, Lateral flow, ELISA"

      - label: "Přednosti"
        name: "features"
        widget: "list"
        required: false
        fields:
          - { label: "Titulek", name: "title", widget: "string" }
          - { label: "Popis", name: "description", widget: "text", required: false }

      - label: "Skupiny cílů / panely"
        name: "target_groups"
        widget: "list"
        required: false
        label_singular: "Panel / skupina"
        summary: "{{name}}"
        hint: "Skupiny detekovaných patogenů nebo analytů. Každá skupina odpovídá jednomu panelu kitu."
        fields:
          - { label: "Název skupiny / panelu", name: "name", widget: "string" }
          - label: "Cíle"
            name: "targets"
            widget: "list"
            label_singular: "Cíl"
            summary: "{{name}}"
            fields:
              - { label: "Název patogenu / analytu", name: "name", widget: "string" }
              - { label: "Zkratka / alias", name: "alias", widget: "string", required: false }
              - { label: "Poznámka", name: "note", widget: "text", required: false }

      - label: "Skupiny produktů (záložky)"
        name: "groups"
        widget: "list"
        required: false
        label_singular: "Skupina / záložka"
        summary: "{{name}}"
        hint: >
          Každá skupina se zobrazí jako záložka nad tabulkou.
          Pokud je jen jedna skupina, záložky se nezobrazí — zobrazí se rovnou tabulka.
        fields:
          - label: "Název záložky"
            name: "name"
            widget: "string"
            hint: "Např. GI/Enteric, Tropical, Hepatitis, Respiratory, STI"
          - label: "Položky"
            name: "items"
            widget: "list"
            label_singular: "Položka"
            summary: "{{name}} — {{cat_no}}"
            fields:
              - { label: "Název produktu", name: "name", widget: "string" }
              - { label: "Katalogové číslo", name: "cat_no", widget: "string" }
              - { label: "Typ vzorku", name: "specimen", widget: "string", required: false, hint: "Např. Stolice, Sérum/Plazma, WB/S/P" }
              - { label: "Formát", name: "format", widget: "string", required: false, hint: "Např. Cassette, Dipstick, Cup" }
              - { label: "Cut-Off", name: "cut_off", widget: "string", required: false }
              - { label: "CE označení", name: "ce_mark", widget: "string", required: false, hint: "Např. CE, CE IVD, Non-CE" }
              - { label: "Balení / poznámka", name: "note", widget: "string", required: false, hint: "Např. 60 testů, 96 testů" }

      - label: "Vysvětlující popisek pod tabulkou"
        name: "table_note"
        widget: "text"
        required: false
        hint: "Zobrazí se pod tabulkou, ideálně pro vysvětlení zkratek, formátů, typů vzorků apod."

      - label: "Specifikace"
        name: "specs"
        widget: "list"
        required: false
        hint: "Volné položky 'Název' + 'Hodnota' — přidejte jen to, co dává smysl pro daný kit (např. Skladovací teplota, Senzitivita, Kompatibilní systémy…)."
        fields:
          - { label: "Název parametru", name: "name", widget: "string" }
          - { label: "Hodnota", name: "value", widget: "string" }
          - { label: "Jednotka", name: "unit", widget: "string", required: false }

      - { label: "Tagy", name: "tags", widget: "list", required: false }

      - label: "Cena"
        name: "price"
        widget: "string"
        required: false
        hint: "Orientační cena zobrazená na kartičce produktu (např. od 1 200 Kč). Nevyplňujte, pokud cenu nezveřejňujete."

      - label: "Odkazy / Soubory"
        name: "assets"
        widget: "object"
        required: false
        fields:
          - { label: "Datový list (PDF)", name: "datasheet", widget: "file", required: false }
          - { label: "Návod k použití / IFU (PDF)", name: "ifu", widget: "file", required: false }
          - { label: "Externí odkaz", name: "external_url", widget: "string", required: false }
          - { label: "Odkaz do e-shopu", name: "eshop_url", widget: "string", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta description", name: "meta_description", widget: "text", required: false }

  - name: "consumables"
    label: "Reagencie a spotřební materiál"
    folder: "content/consumables"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - label: "Název"
        name: "title"
        widget: "string"
        hint: "Marketingový název produktu"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL identifikátor (např. ergo-reagens-pcr-kit)"
      - label: "Stručný popis"
        name: "summary"
        widget: "text"

      - label: "Výrobce"
        name: "companies"
        widget: "list"
        label_singular: "Výrobce"
        required: false
        hint: "Vyberte výrobce ze seznamu společností"
        fields:
          - label: "Výrobce"
            name: "slug"
            widget: "relation"
            collection: "companies"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Podkategorie"
        name: "subcategories"
        widget: "list"
        label_singular: "Podkategorie"
        required: false
        hint: "Vyberte podkategorie produktu ze seznamu typů"
        fields:
          - label: "Podkategorie"
            name: "slug"
            widget: "relation"
            collection: "subcategories"
            search_fields: ["name", "slug"]
            value_field: "slug"
            display_fields: ["name"]

      - label: "Vypíchnutý produkt?"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Viditelný"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "Pokud je vypnuto, produkt se nezobrazí v katalogu, vyhledávání ani na stránce výrobce."

      - label: "Hlavní obrázek"
        name: "hero_image"
        widget: "image"
        allow_multiple: false
        required: false

      - label: "Galerie"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Obrázek"
          name: "image"
          widget: "image"

      - label: "Přednosti"
        name: "features"
        widget: "list"
        required: false
        fields:
          - { label: "Titulek", name: "title", widget: "string" }
          - { label: "Popis", name: "description", widget: "text", required: false }

      - label: "Specifikace"
        name: "specs"
        widget: "list"
        required: false
        hint: "Volné položky 'Název' + 'Hodnota' — přidejte jen to, co dává smysl pro daný produkt."
        fields:
          - { label: "Název parametru", name: "name", widget: "string" }
          - { label: "Hodnota", name: "value", widget: "string" }
          - { label: "Jednotka", name: "unit", widget: "string", required: false }

      - { label: "Tagy", name: "tags", widget: "list", required: false }

      - label: "Cena"
        name: "price"
        widget: "string"
        required: false
        hint: "Orientační cena zobrazená na kartičce produktu (např. od 1 200 Kč). Nevyplňujte, pokud cenu nezveřejňujete."

      - label: "Odkazy / Soubory"
        name: "assets"
        widget: "object"
        required: false
        fields:
          - { label: "Datový list (PDF)", name: "datasheet", widget: "file", required: false }
          - { label: "Externí odkaz", name: "external_url", widget: "string", required: false }
          - { label: "Odkaz do e-shopu", name: "eshop_url", widget: "string", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta description", name: "meta_description", widget: "text", required: false }

      - { label: "Popis (Markdown)", name: "body", widget: "markdown", required: false }
